<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClientRadar Settings</title>
<style>
body{font:14px system-ui,sans-serif;max-width:560px;margin:32px auto;padding:0 16px;background:#111;color:#f4f1e9}
label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #555;border-radius:6px;background:#222;color:#fff}
button{margin-top:18px;padding:10px 18px;border:0;border-radius:7px;background:#c99b55;font-weight:700}
.note{color:#c6c1b7;line-height:1.5}#status{margin-top:12px}
</style></head>
<body>
<h1>ClientRadar Capture settings</h1>
<p class="note">Use the pairing token from your already-connected ClientRadar Companion. The token is stored in this browser's extension storage and is sent only to your configured HTTPS ClientRadar server.</p>
<label for="serverUrl">ClientRadar server URL</label>
<input id="serverUrl" type="url" placeholder="https://clientradar-fxrsau.v2.appdeploy.ai">
<label for="deviceToken">Paired companion token</label>
<input id="deviceToken" type="password" autocomplete="off" placeholder="Paste device token">
<button id="save">Save settings</button>
<div id="status" role="status"></div>
<script src="options.js"></script>
</body></html>
