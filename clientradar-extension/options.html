<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClientRadar Settings</title><style>body{font:14px system-ui;max-width:560px;margin:32px auto;padding:0 16px;background:#111;color:#f4f1e9}label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:10px;background:#222;color:white;border:1px solid #555;border-radius:6px}button{margin-top:18px;padding:10px 18px;background:#c99b55;border:0;border-radius:7px;font-weight:700}.note{color:#c6c1b7;line-height:1.5}</style></head><body><h1>ClientRadar Settings</h1><p class="note">Set the expiry time from your authorisation privately in this browser. It is stored locally and is not included in the repository. Use the authorised Facebook account only.</p><label>ClientRadar server URL</label><input id="serverUrl" type="url"><label>Paired companion token</label><input id="deviceToken" type="password" autocomplete="off"><label>Authorisation expiry (your local date and time)</label><input id="expiry" type="datetime-local"><label>Refresh interval (minutes, 1–30)</label><input id="refreshMinutes" type="number" min="1" max="30"><button id="save">Save settings</button><div id="status"></div><script src="options.js"></script></body></html>
