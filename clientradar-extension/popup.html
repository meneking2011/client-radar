<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClientRadar Capture</title>
  <style>
    body{font:14px system-ui,sans-serif;width:300px;margin:0;padding:16px;background:#111;color:#f4f1e9}
    h1{font-size:17px;margin:0 0 8px}p{color:#c6c1b7;line-height:1.45}
    button{width:100%;padding:11px;border:0;border-radius:8px;background:#c99b55;color:#15120c;font-weight:700}

<body>
  <h1>ClientRadar Capture</h1>
  <p>Select the text of one public post on a Facebook search page, then press the button. Nothing is collected until you press it.</p>

  <div id="status" role="status">Ready</div>
  <p class="small">This does not refresh or monitor Facebook automatically. <a href="options.html" target="_blank">Settings</a></p>
