name: Build ClientRadar Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ClientRadar-Android-Companion-Source.zip'
      - 'android-companion/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q ClientRadar-Android-Companion-Source.zip -d source
          cp -R android-companion/. source/ClientRadar-Android-Companion/
          sed -i "s/targetSdk 35/targetSdk 29/" source/ClientRadar-Android-Companion/app/build.gradle

      - name: Build APK
        run: |
          /tmp/gradle-8.9/bin/gradle \
            -p source/ClientRadar-Android-Companion \
            assembleDebug --no-daemon

      - name: Launch Android 10 emulator and capture startup logs
        id: emulator_test
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            mkdir -p emulator-test
            APK="source/ClientRadar-Android-Companion/app/build/outputs/apk/debug/app-debug.apk"
            adb -s emulator-5554 wait-for-device
            adb -s emulator-5554 install -r "$APK"
            adb -s emulator-5554 shell monkey -p ai.clientradar.companion -c android.intent.category.LAUNCHER 1
            sleep 10
            adb -s emulator-5554 shell pidof ai.clientradar.companion > emulator-test/app-pid.txt || true
            adb -s emulator-5554 shell dumpsys activity activities > emulator-test/activities.txt || true
            adb -s emulator-5554 logcat -d -v threadtime > emulator-test/logcat.txt || true
            if [ ! -s emulator-test/app-pid.txt ]; then
              echo "The app process was not running 10 seconds after launch." > emulator-test/result.txt
            else
              echo "The app process remained alive 10 seconds after launch." > emulator-test/result.txt
            fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClientRadar-Emulator-Diagnostics
          path: emulator-test/
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClientRadar-Android-APK
          path: source/ClientRadar-Android-Companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
