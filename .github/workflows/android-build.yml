
name: Build ClientRadar Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ClientRadar-Android-Companion-Source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp

      - name: Build APK
        run: |
          unzip -q ClientRadar-Android-Companion-Source.zip -d source
          /tmp/gradle-8.9/bin/gradle \
            -p source/ClientRadar-Android-Companion \
            assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ClientRadar-Android-APK
          path: source/ClientRadar-Android-Companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
