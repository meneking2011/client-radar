
name: Build ClientRadar Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ClientRadar-Android-Companion-Source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp

      - name: Extract Android project
        run: |
          unzip -q ClientRadar-Android-Companion-Source.zip -d source

      - name: Inspect Android source before build
        run: |
          echo '===== PROJECT FILES ====='
          find source/ClientRadar-Android-Companion -maxdepth 8 -type f | sort
          find source/ClientRadar-Android-Companion/app/src/main -type f | grep -E '\\.(kt|xml)$' | while IFS= read -r file; do
            echo "===== $file ====="
            cat "$file"
          done
          for file in source/ClientRadar-Android-Companion/app/build.gradle source/ClientRadar-Android-Companion/build.gradle source/ClientRadar-Android-Companion/settings.gradle source/ClientRadar-Android-Companion/README.md; do
            if [ -f "$file" ]; then echo "===== $file ====="; cat "$file"; fi
          done

      - name: Build APK
        run: |
          /tmp/gradle-8.9/bin/gradle \
            -p source/ClientRadar-Android-Companion \
            assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClientRadar-Android-APK
          path: source/ClientRadar-Android-Companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
