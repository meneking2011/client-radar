
name: Build ClientRadar Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ClientRadar-Android-Companion-Source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp

      - name: Extract Android project
        run: |
          unzip -q ClientRadar-Android-Companion-Source.zip -d source

      - name: Build APK
        run: |
          /tmp/gradle-8.9/bin/gradle \
            -p source/ClientRadar-Android-Companion \
            assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClientRadar-Android-APK
          path: source/ClientRadar-Android-Companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
